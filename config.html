   <h1>コンフィグ変更とは</h1>
<p>マイクラにはmodごとに、コンフィグというmodのシステムを変更できるものがあります<br>
  Kenma データパックを適応するためにそれを変更してください</p>
  <h2>手順</h2>
    <ol>
      <li>configer modをインストールしていることが前提です<br>
        まずマイクラのホーム画面を開き、MODのタブから指定するmodの欄をクリックし、設定タブを開きます<br>
        ワールド選択欄が出るなら変更したいワールドを選び、こちらが指定するところを変更してもらいます
        </li>
    </ol>
